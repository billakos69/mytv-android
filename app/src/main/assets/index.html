<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Δική μου Τηλεόραση</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#d6336c;--bd:#ddd9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--tx:#eee;--mu:#9a9aa2;--bd:#2c2c32}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--tx:#eee;--mu:#9a9aa2;--bd:#2c2c32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font-size:17px;margin-right:auto}
nav button,.b{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
nav button.on,.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px}
.tv{background:#000;border-radius:12px;aspect-ratio:16/9;width:100%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center}
.tv iframe,.tv video{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;min-width:0}
input.w{flex:1 1 220px}
.mu{color:var(--mu);font-size:13px}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{margin:14px 0 4px;font-size:15px}
.hide{display:none}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.cv{aspect-ratio:2/3;background:var(--bd) center/cover;border-radius:10px;display:flex;align-items:flex-end;cursor:pointer;overflow:hidden}.cv span{width:100%;padding:18px 8px 6px;color:#fff;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.8))}textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:13px monospace}
.tvw{position:relative}.sh{position:absolute;inset:0;z-index:2}#bug{position:absolute;top:10px;right:12px;z-index:3;pointer-events:none}#bug img{max-height:44px;max-width:120px;opacity:.9}#osd{position:absolute;left:14px;top:12px;z-index:3;color:#fff;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:6px;font-weight:600;display:none;pointer-events:none}.lg{height:22px;vertical-align:middle;margin-right:6px}.th{height:34px;border-radius:4px}.s{padding:3px 8px;font-size:12px}.rc button{min-width:44px}.tvw:fullscreen{background:#000}.tvw:fullscreen .tv{height:100%;aspect-ratio:auto;border-radius:0}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}#dlg.hide{display:none}#dbox{max-width:420px;width:100%}
.nx{position:absolute;right:14px;bottom:64px;z-index:5;background:rgba(0,0,0,.85);color:#fff;border-radius:10px;padding:12px 14px;max-width:320px}.nx .row{margin:8px 0 0}.li.on span:nth-of-type(1){color:var(--ac);font-weight:600}
.xb{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6}.ffs{position:fixed!important;inset:0;z-index:40;background:#000;border-radius:0}.ffs .xb{display:block}.ffs .tv{height:100%;aspect-ratio:auto;border-radius:0}
#osd{white-space:pre-line}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}@media(min-width:1200px){body{font-size:18px}}
#snow{position:absolute;inset:0;width:100%;height:100%;z-index:3;display:none;pointer-events:none;image-rendering:pixelated}
