name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html
        run: |
          s=$(wc -c < app/src/main/assets/index.html)
          echo "index.html: $s bytes"
          if [ "$s" -lt 50000 ]; then echo "::error::index.html is truncated ($s bytes). Upload the full file (~58 KB) with Upload files."; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Fixed signing key (optional)
        run: |
          if [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > debug.keystore
            keytool -list -keystore debug.keystore -storepass android
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk
